name = "al2100test"
main = "worker.ts"
compatibility_date = "2026-10-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "al2100"
database_id = "1431274d-c8d8-431b-aa1f-eaff2c466ada"

[[kv_namespaces]]
binding = "CACHE"
id = "87d4fd94c6114923b3ef02ae7069115c"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "al2100"

[[queues.producers]]
binding = "JOBS"
queue = "al2100"

[[queues.consumers]]
queue = "al200"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "al2100beta-dlq"

[vars]
ENVIRONMENT = "production"
MEDIA_PUBLIC_BASE = "https://al2100test.axelgadomski.workers.dev/media"

[observability]
enabled = true
